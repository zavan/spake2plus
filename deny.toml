# cargo-deny: bin/check runs `licenses bans sources`, which only the
# dependency tree decides. `advisories` reads an outside database that
# changes on its own, so it runs on demand instead (README, Contributing).

[graph]
all-features = true

[licenses]
# Every license in the tree, each permissive and compatible with MIT.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
